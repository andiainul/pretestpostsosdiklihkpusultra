<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sosialisasi Pendidikan Pemilih Berkelanjutan — Pretest &amp; Posttest</title>
  <meta name="description" content="Platform interaktif Pretest & Posttest Sosialisasi Pendidikan Pemilih Berkelanjutan dengan grafik progres belajar dan sinkronisasi Google Sheets." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #b91c1c;
      --accent-hover: #991b1b;
      --ok: #059669;
      --warn: #d97706;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4 { font-family: "Plus Jakarta Sans", system-ui, sans-serif; margin: 0; }
    .mono { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
    .hidden { display: none !important; }
    .container { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

    /* Top Bar */
    header.topbar {
      position: sticky; top: 0; z-index: 40;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      display: flex; align-items: center; justify-content: space-between; gap: 24px;
      height: 64px;
    }
    .brand {
      font-family: "Plus Jakarta Sans", sans-serif;
      font-weight: 800; font-size: 1.05rem; color: var(--ink);
      background: none; border: 0; cursor: pointer; padding: 0; white-space: nowrap;
    }
    nav.nav-links { display: flex; align-items: center; gap: 22px; }
    nav.nav-links button {
      background: none; border: 0; padding: 6px 2px; cursor: pointer;
      font: inherit; font-size: 0.9rem; font-weight: 500; color: var(--muted);
      border-bottom: 2px solid transparent; white-space: nowrap;
    }
    nav.nav-links button.active { color: var(--ink); font-weight: 700; border-bottom-color: var(--accent); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 18px; border-radius: 10px; border: 1px solid transparent;
      font: inherit; font-size: 0.875rem; font-weight: 600; cursor: pointer;
      transition: background-color 0.16s ease, border-color 0.16s ease, opacity 0.16s ease;
      white-space: nowrap; text-decoration: none;
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-dark { background: var(--ink); color: #fff; }
    .btn-dark:hover:not(:disabled) { background: #1e293b; }
    .btn-outline { background: #fff; color: var(--ink); border-color: #cbd5e1; }
    .btn-outline:hover:not(:disabled) { background: #f8fafc; }
    .btn-sm { padding: 7px 12px; font-size: 0.78rem; border-radius: 8px; }

    /* Cards & Layout */
    main { padding: 36px 0 64px; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 24px;
    }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    .hero-grid { display: grid; grid-template-columns: 1.25fr 0.75fr; gap: 32px; align-items: stretch; }

    .meta-line { font-size: 0.78rem; color: var(--muted); font-weight: 500; }
    .hero-title { font-size: clamp(1.75rem, 3.5vw, 2.65rem); line-height: 1.15; margin-top: 10px; text-wrap: balance; }
    .hero-sub { color: #475569; font-size: 1rem; margin: 14px 0 0; max-width: 60ch; }
    .menu-card {
      text-align: left; background: #fff; border: 1px solid var(--border);
      border-radius: 14px; padding: 22px; cursor: pointer; width: 100%;
      transition: border-color 0.16s ease, transform 0.16s ease;
    }
    .menu-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .menu-card h3 { font-size: 1.1rem; margin-top: 12px; color: var(--ink); }
    .menu-card p { font-size: 0.86rem; color: #475569; margin: 6px 0 14px; }

    /* Form Controls */
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #1e293b; }
    .input, select, textarea {
      width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 9px;
      font: inherit; font-size: 0.9rem; color: var(--ink); background: #fff;
    }
    .input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.12);
    }

    /* Quiz Stage */
    .quiz-grid { display: grid; grid-template-columns: 1fr 320px; gap: 24px; align-items: start; }
    .opt-btn {
      width: 100%; text-align: left; display: flex; align-items: flex-start; gap: 12px;
      padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px;
      background: #fff; cursor: pointer; font: inherit; font-size: 0.94rem; color: var(--ink);
      margin-bottom: 10px; transition: border-color 0.15s ease, background-color 0.15s ease;
    }
    .opt-btn:hover { border-color: #94a3b8; background: #f8fafc; }
    .opt-btn.selected { border-color: var(--accent); background: #fef2f2; font-weight: 600; }
    .opt-letter {
      width: 28px; height: 28px; border-radius: 8px; flex: none;
      display: grid; place-items: center; font-size: 0.8rem; font-weight: 700;
      background: #f1f5f9; color: #334155; font-family: "IBM Plex Mono", monospace;
    }
    .opt-btn.selected .opt-letter { background: var(--accent); color: #fff; }
    .q-map { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 12px; }
    .q-dot {
      height: 38px; border-radius: 8px; border: 1px solid var(--border);
      background: #fff; font-family: "IBM Plex Mono", monospace; font-size: 0.8rem; font-weight: 600;
      cursor: pointer; color: #334155;
    }
    .q-dot.current { background: var(--ink); color: #fff; border-color: var(--ink); }
    .q-dot.answered { background: #ecfdf5; border-color: #6ee7b7; color: #065f46; }
    .q-dot.flagged { background: #fffbeb; border-color: #fcd34d; color: #92400e; }

    .progress-track { height: 8px; background: #e2e8f0; border-radius: 99px; overflow: hidden; margin-top: 8px; }
    .progress-fill { height: 100%; background: var(--accent); transition: width 0.2s ease; }

    /* Alerts & Badges */
    .alert { padding: 12px 16px; border-radius: 10px; font-size: 0.85rem; border: 1px solid; margin-top: 12px; }
    .alert-ok { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; }
    .alert-warn { background: #fffbeb; border-color: #fde68a; color: #92400e; }
    .alert-err { background: #fef2f2; border-color: #fecaca; color: #991b1b; }

    /* Tables & Tabs */
    .tabs { display: inline-flex; flex-wrap: wrap; gap: 6px; padding: 4px; background: #e2e8f0; border-radius: 10px; }
    .tab-btn {
      border: 0; background: transparent; padding: 8px 14px; border-radius: 7px;
      font: inherit; font-size: 0.8rem; font-weight: 600; color: #475569; cursor: pointer;
    }
    .tab-btn.active { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; text-align: left; }
    th, td { padding: 11px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { background: #f8fafc; color: #475569; font-weight: 700; }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 60; background: rgba(15, 23, 42, 0.52);
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-box {
      background: #fff; border: 1px solid var(--border); border-radius: 14px;
      padding: 24px; max-width: 520px; width: 100%; max-height: 90vh; overflow-y: auto;
    }

    footer { border-top: 1px solid var(--border); background: #fff; padding: 20px 0; font-size: 0.78rem; color: var(--muted); }
    @media (max-width: 900px) {
      .hero-grid, .quiz-grid, .grid-4 { grid-template-columns: 1fr; }
      nav.nav-links { display: none; }
      .mobile-nav { display: flex !important; gap: 8px; flex-wrap: wrap; padding: 10px 20px; border-top: 1px solid var(--border); background: #fff; }
    }
    @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }
    @media print { .no-print { display: none !important; } body { background: #fff; } }
  </style>
</head>
<body>
  <header class="topbar no-print">
    <div class="container topbar-inner">
      <button class="brand" id="navHomeBrand">Pendidikan Pemilih</button>
      <nav class="nav-links" aria-label="Navigasi utama">
        <button data-nav="home" class="active">Beranda</button>
        <button data-nav="pretest">Pretest</button>
        <button data-nav="posttest">Posttest</button>
        <button data-nav="progress">Progres Belajar</button>
      </nav>
      <button class="btn btn-dark btn-sm" data-nav="admin">Dashboard Panitia</button>
    </div>
    <div class="mobile-nav hidden">
      <button class="btn btn-outline btn-sm" data-nav="home">Beranda</button>
      <button class="btn btn-outline btn-sm" data-nav="pretest">Pretest</button>
      <button class="btn btn-outline btn-sm" data-nav="posttest">Posttest</button>
      <button class="btn btn-outline btn-sm" data-nav="progress">Progres Belajar</button>
    </div>
  </header>

  <main class="container" id="app"></main>

  <footer class="no-print">
    <div class="container" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;">
      <span id="footerTitle">Sosialisasi Pendidikan Pemilih Berkelanjutan · Sarana Edukasi Publik</span>
      <span>Data tersimpan real-time &amp; siap sinkronisasi Google Sheets</span>
    </div>
  </footer>

  <div id="modalRoot"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore, collection, doc, getDoc, getDocs, setDoc, deleteDoc,
      query, orderBy, writeBatch, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ===== KONFIGURASI FIREBASE & GOOGLE SHEETS =====
    const firebaseConfig = {
      apiKey: "AIzaSyAXw-Y5UwAXf8fSJQM6SfoTdTyw1Ec1Vbk",
      authDomain: "gen-lang-client-0144018210.firebaseapp.com",
      projectId: "gen-lang-client-0144018210",
      storageBucket: "gen-lang-client-0144018210.firebasestorage.app",
      messagingSenderId: "374938050729",
      appId: "1:374938050729:web:fb9b023a67e6fc758289b8"
    };
    const FIRESTORE_DB_ID = "ai-studio-da3a74d7-6030-4d03-8dc0-3582b46009ee";
    const DEFAULT_SPREADSHEET_ID = "1ceaXB9MfA09NJAuyC_kw8D1-JJtDtU90JV6cCXYJMOQ";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app, FIRESTORE_DB_ID);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.addScope("https://www.googleapis.com/auth/spreadsheets");
    provider.setCustomParameters({ prompt: "select_account" });

    // ===== SOAL BAWAAN PENDIDIKAN PEMILIH =====
    const DEFAULT_QUESTIONS = [
      { id: "pemilu_01", mode: "both", topic: "Asas & Prinsip Pemilu", prompt: "Apa kepanjangan asas Pemilu di Indonesia yang dikenal dengan singkatan LUBER dan JURDIL?", options: ["Langsung, Umum, Bebas, Rahasia serta Jujur dan Adil", "Lugas, Utama, Bersama, Resmi serta Jujur dan Disiplin", "Langsung, Utuh, Bersih, Ramah serta Jelas dan Adil", "Lancar, Umum, Bebas, Rahasia serta Jernih dan Adil"], correctIndex: 0, explanation: "Sesuai UUD 1945 Pasal 22E ayat (1), Pemilu dilaksanakan secara Langsung, Umum, Bebas, Rahasia, Jujur, dan Adil.", order: 1, isActive: true },
      { id: "pemilu_02", mode: "both", topic: "Asas & Prinsip Pemilu", prompt: "Makna asas \"Rahasia\" dalam pemungutan suara berarti bahwa...", options: ["Hasil rekapitulasi suara tidak diumumkan ke masyarakat", "Pilihan pemilih di bilik suara dijamin tidak diketahui pihak mana pun", "Jadwal pencoblosan dirahasiakan hingga hari pemilihan", "Daftar nama peserta pemilu dirahasiakan penyelenggara"], correctIndex: 1, explanation: "Asas Rahasia menjamin setiap pemilih memberikan suaranya tanpa diketahui orang lain sehingga bebas dari tekanan.", order: 2, isActive: true },
      { id: "pemilu_03", mode: "both", topic: "Hak & Daftar Pemilih", prompt: "Syarat usia minimal WNI untuk terdaftar sebagai pemilih dalam Pemilu adalah...", options: ["Berusia 16 tahun pada hari pemungutan suara", "Berusia genap 17 tahun atau lebih pada hari pemungutan suara, atau sudah/pernah kawin", "Berusia 18 tahun saat pendaftaran partai politik", "Berusia 21 tahun dan berpenghasilan tetap"], correctIndex: 1, explanation: "WNI yang pada hari pemungutan suara berumur genap 17 tahun atau lebih, atau sudah/pernah kawin, memiliki hak memilih.", order: 3, isActive: true },
      { id: "pemilu_04", mode: "both", topic: "Hak & Daftar Pemilih", prompt: "Bagaimana cara mandiri mengecek apakah nama sudah terdaftar dalam Daftar Pemilih Tetap (DPT)?", options: ["Mengirim surat permohonan ke Kementerian Dalam Negeri", "Mengakses laman resmi cekdptonline.kpu.go.id dengan memasukkan NIK", "Menunggu undangan tanpa mengecek data", "Mendaftarkan diri ulang di kantor partai politik"], correctIndex: 1, explanation: "Masyarakat dapat mengecek status DPT secara daring di cekdptonline.kpu.go.id memakai NIK.", order: 4, isActive: true },
      { id: "pemilu_05", mode: "both", topic: "Hak & Daftar Pemilih", prompt: "Pemilih yang sudah terdaftar di DPT namun bertugas/pindah domisili pada hari pemilihan mengurus kategori...", options: ["Daftar Pemilih Khusus (DPK)", "Daftar Pemilih Tambahan (DPTb) / Pindah Memilih", "Daftar Pemilih Sementara Ulang", "Pemilih Susulan Tanpa Dokumen"], correctIndex: 1, explanation: "Pemilih terdaftar DPT yang berpindah lokasi memilih karena alasan sah mengurus pindah memilih agar tercatat dalam DPTb.", order: 5, isActive: true },
      { id: "pemilu_06", mode: "both", topic: "Tahapan & Pemungutan Suara", prompt: "Sebelum mencoblos di bilik suara, hal penting yang harus diperiksa pemilih pada surat suara adalah...", options: ["Langsung melipat kembali tanpa membuka surat suara", "Menandatangani surat suara dengan nama lengkap", "Memeriksa surat suara tidak rusak/cacat serta sudah ditandatangani Ketua KPPS", "Memfoto surat suara sebagai bukti ke pihak lain"], correctIndex: 2, explanation: "Pemilih berhak memastikan surat suara dalam kondisi baik dan ditandatangani Ketua KPPS sebelum mencoblos.", order: 6, isActive: true },
      { id: "pemilu_07", mode: "both", topic: "Tahapan & Pemungutan Suara", prompt: "Manakah kondisi berikut yang menyebabkan surat suara dinyatakan SAH?", options: ["Tanda coblos di luar kotak pasangan calon atau partai", "Dicoblos tepat pada satu kolom nomor urut, foto, atau nama calon/partai memakai alat coblos TPS", "Dicoblos lebih dari satu pasangan calon berbeda", "Diberi tulisan dukungan dengan pulpen di belakang surat suara"], correctIndex: 1, explanation: "Surat suara sah bila ditandatangani Ketua KPPS dan tanda coblos berada pada satu kolom calon/partai menggunakan alat coblos resmi.", order: 7, isActive: true },
      { id: "pemilu_08", mode: "both", topic: "Anti Politik Uang & Hoaks", prompt: "Mengapa praktik politik uang (money politics) berbahaya bagi kualitas demokrasi?", options: ["Mempercepat penghitungan suara di TPS", "Merusak kemandirian pilihan rakyat dan memicu perilaku koruptif", "Mengurangi jumlah pemilih pemula di DPT", "Menggantikan fungsi saksi resmi di TPS"], correctIndex: 1, explanation: "Politik uang mencederai kebebasan pemilih, melanggar hukum pemilu, dan berisiko melahirkan pemimpin koruptif.", order: 8, isActive: true },
      { id: "pemilu_09", mode: "both", topic: "Anti Politik Uang & Hoaks", prompt: "Sikap pemilih cerdas ketika menerima informasi viral pemilu tanpa sumber jelas di media sosial adalah...", options: ["Langsung meneruskan ke seluruh grup percakapan", "Langsung percaya bila dikirim oleh kenalan", "Melakukan verifikasi melalui kanal resmi KPU, Bawaslu, atau media terverifikasi", "Tidak datang ke TPS pada hari pemilihan"], correctIndex: 2, explanation: "Pemilih cerdas melakukan verifikasi silang melalui kanal resmi penyelenggara pemilu untuk mencegah penyebaran hoaks.", order: 9, isActive: true },
      { id: "pemilu_10", mode: "both", topic: "Asas & Prinsip Pemilu", prompt: "Apa tujuan utama dari Sosialisasi Pendidikan Pemilih Berkelanjutan?", options: ["Mengarahkan pemilih memilih peserta pemilu tertentu", "Membangun kesadaran kritis, literasi demokrasi, dan partisipasi pemilih yang berintegritas", "Menggantikan tugas KPPS saat pemungutan suara", "Membatasi jumlah pemilih pemula"], correctIndex: 1, explanation: "Pendidikan Pemilih Berkelanjutan bertujuan meningkatkan literasi demokrasi dan partisipasi pemilih yang cerdas serta mandiri.", order: 10, isActive: true }
    ];

    // ===== STATE APLIKASI =====
    const LETTERS = ["A", "B", "C", "D"];
    let activeView = location.hash === "#admin" ? "admin" : "home";
    let adminTab = "overview";
    let publicConfig = {
      activityTitle: "Sosialisasi Pendidikan Pemilih Berkelanjutan",
      subtitle: "Sarana edukasi dan evaluasi pemahaman kepemiluan berbasis web untuk meningkatkan partisipasi pemilih yang cerdas, berdaulat, dan berintegritas.",
      questionPairing: "same",
      pretestMinutes: 15,
      posttestMinutes: 15,
      showInstantExplanation: true
    };
    let adminConfig = {
      spreadsheetId: DEFAULT_SPREADSHEET_ID,
      pretestSheetName: "Pretest",
      posttestSheetName: "Posttest",
      summarySheetName: "Rekap Evaluasi",
      autoSyncOnOpen: false
    };
    let questions = [...DEFAULT_QUESTIONS];
    let isFromFirestore = false;
    let participant = null;
    let currentProgress = null;
    let lastAttempt = null;
    let quizState = null;
    let authUser = null;
    let cachedAccessToken = null;
    let submissions = [];
    let chartInstances = [];

    try {
      const saved = sessionStorage.getItem("pemilih_session_v1");
      if (saved) participant = JSON.parse(saved);
    } catch {}

    const $ = (s) => document.querySelector(s);
    const app$ = $("#app");
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    async function computeParticipantKey(contactRaw) {
      const normalized = contactRaw.trim().toLowerCase().replace(/[\s\-().]/g, "");
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(normalized));
      return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
    }

    function destroyCharts() {
      chartInstances.forEach((c) => c.destroy());
      chartInstances = [];
    }

    function setActiveNav() {
      document.querySelectorAll("[data-nav]").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.nav === activeView);
      });
    }

    async function loadInitialData() {
      try {
        const cfgSnap = await getDoc(doc(db, "settings", "publicConfig"));
        if (cfgSnap.exists()) {
          publicConfig = { ...publicConfig, ...cfgSnap.data() };
          $("#footerTitle").textContent = `${publicConfig.activityTitle} · Sarana Edukasi Publik`;
        }
      } catch {}

      try {
        const qSnap = await getDocs(query(collection(db, "questions"), orderBy("order", "asc")));
        if (!qSnap.empty) {
          questions = qSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
          isFromFirestore = true;
        }
      } catch {}

      if (participant?.participantKey) {
        try {
          const pSnap = await getDoc(doc(db, "progress_index", participant.participantKey));
          if (pSnap.exists()) currentProgress = { participantKey: pSnap.id, ...pSnap.data() };
        } catch {}
      }
      render();
    }

    function getPoolFor(testType) {
      const active = questions.filter((q) => q.isActive !== false);
      if (publicConfig.questionPairing === "same") {
        const list = active.filter((q) => q.mode === "both" || q.mode === testType);
        return list.length ? list : active;
      }
      const exact = active.filter((q) => q.mode === testType);
      return exact.length ? exact : active;
    }

    function navigate(view) {
      if (quizState) {
        showModal(`
          <h3>Keluar dari Sesi Tes?</h3>
          <p style="font-size:0.9rem;color:#475569;margin-top:8px;">Tes sedang berlangsung. Jawaban yang belum dikumpulkan tidak akan tersimpan.</p>
          <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px;">
            <button class="btn btn-outline" id="stayQuizBtn">Lanjutkan Tes</button>
            <button class="btn btn-primary" id="leaveQuizBtn">Ya, Keluar</button>
          </div>`);
        $("#stayQuizBtn").onclick = closeModal;
        $("#leaveQuizBtn").onclick = () => {
          closeModal();

          activeView = view;
          setActiveNav();
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        };

      }

      setActiveNav();
      render();

    // ===== RENDER ROUTER =====
    function render() {
      destroyCharts();
      setActiveNav();
      if (activeView === "home") renderHome();

        if (quizState) renderQuiz();
        else renderParticipantGate(activeView);

              </button>
            </div>

            ${currentProgress ? `
              <div class="card" style="margin-top:16px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
                <div>
                  <div style="font-size:0.88rem;font-weight:700;">Progres tersimpan: ${esc(currentProgress.displayName)}</div>
                  <div class="meta-line mono">Pretest: ${currentProgress.pretestScore ?? "-"} · Posttest: ${currentProgress.posttestScore ?? "-"}</div>
                </div>
                <button class="btn btn-outline btn-sm" id="goProgBanner">Lihat Grafik Progres</button>
              </div>` : ""}
          </div>

          <div class="card" style="display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:linear-gradient(160deg,#ffffff,#f1f5f9);">
            <svg width="110" height="110" viewBox="0 0 120 120" fill="none" aria-hidden="true">

              <path d="M36 42L48 22H84L72 42" fill="#fef2f2" stroke="#b91c1c" stroke-width="3" stroke-linejoin="round"/>
              <line x1="42" y1="54" x2="78" y2="54" stroke="#b91c1c" stroke-width="4" stroke-linecap="round"/>
              <path d="M50 74L57 81L72 65" stroke="#059669" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

        <section style="margin-top:44px;padding-top:28px;border-top:1px solid var(--border);">
          <h2 style="font-size:1.3rem;">Topik Materi yang Diujikan</h2>

            ${topics.map((t, idx) => `
              <div class="card" style="padding:18px;">

      $("#goPre").onclick = () => navigate("pretest");

    // ===== 2. FORM IDENTITAS WAJIB =====
    function renderParticipantGate(testType) {
      const label = testType === "pretest" ? "Pretest" : "Posttest";
      const pool = getPoolFor(testType);
      const mins = testType === "pretest" ? publicConfig.pretestMinutes : publicConfig.posttestMinutes;

      app$.innerHTML = `
        <div style="max-width:600px;margin:0 auto;">
          <button class="btn btn-outline btn-sm" id="backHomeBtn">← Kembali</button>
          <div class="card" style="margin-top:16px;">
            <div class="meta-line mono">${label} · ${pool.length} soal · ${mins} menit</div>
            <h1 style="font-size:1.5rem;margin-top:6px;">Identitas Peserta ${label}</h1>
            <p style="font-size:0.88rem;color:var(--muted);margin:8px 0 20px;">
              Gunakan <strong>No. HP / Email yang sama</strong> saat Pretest dan Posttest agar grafik perbandingan progres Anda tersambung otomatis.

            <form id="gateForm">
              <div class="field">
                <label for="fName">Nama Lengkap *</label>
                <input class="input" id="fName" required maxlength="120" value="${esc(participant?.fullName || "")}" placeholder="Contoh: Siti Rahmawati" />
              </div>
              <div class="field">
                <label for="fContact">No. HP / Email *</label>
                <input class="input" id="fContact" required maxlength="120" value="${esc(participant?.contact || "")}" placeholder="Contoh: 081234567890 atau nama@email.com" />
              </div>
              <div class="field">
                <label for="fRegion">Asal Daerah *</label>
                <input class="input" id="fRegion" required maxlength="120" value="${esc(participant?.region || "")}" placeholder="Contoh: Kota Kendari / Kab. Konawe" />
              </div>
              <div id="gateErr"></div>
              <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px;">
                <button type="button" class="btn btn-outline" id="cancelGateBtn">Batal</button>
                <button type="submit" class="btn btn-primary" id="startQuizBtn">Mulai ${label} Sekarang →</button>
              </div>
            </form>
          </div>
        </div>`;

      $("#backHomeBtn").onclick = $("#cancelGateBtn").onclick = () => navigate("home");
      $("#gateForm").onsubmit = async (e) => {
        e.preventDefault();
        const fullName = $("#fName").value.trim();
        const contact = $("#fContact").value.trim();
        const region = $("#fRegion").value.trim();
        if (fullName.length < 2 || contact.length < 5 || region.length < 2) {
          $("#gateErr").innerHTML = `<div class="alert alert-err">Mohon lengkapi Nama, No. HP/Email (min. 5 karakter), dan Asal Daerah dengan benar.</div>`;
          return;
        }
        $("#startQuizBtn").disabled = true;
        $("#startQuizBtn").textContent = "Mempersiapkan...";
        const participantKey = await computeParticipantKey(contact);
        participant = { fullName, contact, region, participantKey };
        try { sessionStorage.setItem("pemilih_session_v1", JSON.stringify(participant)); } catch {}
        try {
          const snap = await getDoc(doc(db, "progress_index", participantKey));
          if (snap.exists()) currentProgress = { participantKey: snap.id, ...snap.data() };
        } catch {}

        quizState = {
          testType,
          questions: pool,
          index: 0,
          answers: {},
          flagged: {},
          startedAt: Date.now(),
          secondsLeft: mins * 60,
          submitting: false
        };
        quizState.timer = setInterval(() => {
          if (!quizState) return;
          quizState.secondsLeft = Math.max(0, quizState.secondsLeft - 1);
          const el = $("#timerBadge");
          if (el) {
            const m = Math.floor(quizState.secondsLeft / 60);
            const s = quizState.secondsLeft % 60;
            el.textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
          }
          if (quizState.secondsLeft === 0 && !quizState.submitting) submitQuiz();
        }, 1000);
        renderQuiz();
      };
    }

    // ===== 3. SESI KUIS INTERAKTIF =====
    function renderQuiz() {
      const qs = quizState;
      const q = qs.questions[qs.index];
      const answeredCount = qs.questions.filter((x) => typeof qs.answers[x.id] === "number").length;
      const pct = Math.round((answeredCount / Math.max(1, qs.questions.length)) * 100);
      const m = Math.floor(qs.secondsLeft / 60);
      const s = qs.secondsLeft % 60;
      const label = qs.testType === "pretest" ? "Pretest" : "Posttest";

      app$.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding-bottom:18px;border-bottom:1px solid var(--border);">
          <div>
            <div class="meta-line">${label} · ${esc(participant.fullName)} · ${esc(participant.region)}</div>
            <h1 style="font-size:1.35rem;margin-top:4px;">Soal ${qs.index + 1} dari ${qs.questions.length}</h1>
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            <span class="card mono" id="timerBadge" style="padding:8px 14px;font-weight:700;font-size:0.9rem;">${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}</span>
            <button class="btn btn-outline btn-sm" id="exitQuizBtn">Keluar</button>
          </div>
        </div>

        <div class="quiz-grid" style="margin-top:24px;">
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
              <span class="meta-line">Topik: ${esc(q.topic)}</span>
              <button class="btn btn-outline btn-sm" id="flagBtn">${qs.flagged[q.id] ? "Ditandai Ragu" : "Tandai Ragu-ragu"}</button>
            </div>
            <p style="font-size:1.12rem;font-weight:700;margin:16px 0 20px;">${esc(q.prompt)}</p>
            <div>
              ${q.options.map((opt, idx) => `
                <button class="opt-btn ${qs.answers[q.id] === idx ? "selected" : ""}" data-opt="${idx}">
                  <span class="opt-letter">${LETTERS[idx]}</span>
                  <span>${esc(opt)}</span>
                </button>`).join("")}
            </div>
            <div style="display:flex;justify-content:space-between;margin-top:22px;padding-top:16px;border-top:1px solid var(--border);">
              <button class="btn btn-outline" id="prevQBtn" ${qs.index === 0 ? "disabled" : ""}>← Sebelumnya</button>
              ${qs.index < qs.questions.length - 1
                ? `<button class="btn btn-dark" id="nextQBtn">Selanjutnya →</button>`
                : `<button class="btn btn-primary" id="finishQBtn">Selesai &amp; Lihat Skor</button>`}
            </div>
          </div>

          <aside class="card">
            <div style="display:flex;justify-content:space-between;font-size:0.85rem;font-weight:700;">
              <span>Progres Pengerjaan</span>
              <span class="mono" style="color:var(--accent);">${answeredCount}/${qs.questions.length} (${pct}%)</span>
            </div>
            <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
            <div class="meta-line" style="margin-top:18px;">Navigasi Nomor Soal</div>
            <div class="q-map">
              ${qs.questions.map((item, idx) => {
                let cls = "q-dot";
                if (idx === qs.index) cls += " current";
                else if (qs.flagged[item.id]) cls += " flagged";
                else if (typeof qs.answers[item.id] === "number") cls += " answered";
                return `<button class="${cls}" data-jump="${idx}">${idx + 1}</button>`;
              }).join("")}
            </div>
            <button class="btn btn-primary" style="width:100%;margin-top:20px;" id="sideFinishBtn">Kumpulkan ${label}</button>
          </aside>
        </div>`;

      $("#exitQuizBtn").onclick = () => navigate("home");
      $("#flagBtn").onclick = () => { qs.flagged[q.id] = !qs.flagged[q.id]; renderQuiz(); };
      document.querySelectorAll("[data-opt]").forEach((btn) => {
        btn.onclick = () => { qs.answers[q.id] = Number(btn.dataset.opt); renderQuiz(); };
      });
      document.querySelectorAll("[data-jump]").forEach((btn) => {
        btn.onclick = () => { qs.index = Number(btn.dataset.jump); renderQuiz(); };
      });
      if ($("#prevQBtn")) $("#prevQBtn").onclick = () => { qs.index--; renderQuiz(); };
      if ($("#nextQBtn")) $("#nextQBtn").onclick = () => { qs.index++; renderQuiz(); };
      const openConfirm = () => {
        const unanswered = qs.questions.length - answeredCount;
        showModal(`
          <h3>Kumpulkan Jawaban ${label}?</h3>
          <p style="font-size:0.9rem;color:#475569;margin-top:8px;">Anda telah menjawab <strong class="mono">${answeredCount} dari ${qs.questions.length}</strong> soal.</p>
          ${unanswered > 0 ? `<div class="alert alert-warn">Masih ada <strong>${unanswered} soal</strong> yang belum dijawab.</div>` : ""}
          <div id="submitModalErr"></div>
          <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px;">
            <button class="btn btn-outline" id="cancelSub">Periksa Lagi</button>
            <button class="btn btn-primary" id="confirmSub">Ya, Kumpulkan Sekarang</button>
          </div>`);
        $("#cancelSub").onclick = closeModal;
        $("#confirmSub").onclick = submitQuiz;
      };
      if ($("#finishQBtn")) $("#finishQBtn").onclick = openConfirm;
      $("#sideFinishBtn").onclick = openConfirm;
    }

    async function submitQuiz() {
      if (!quizState || quizState.submitting) return;
      quizState.submitting = true;
      if ($("#confirmSub")) { $("#confirmSub").disabled = true; $("#confirmSub").textContent = "Menyimpan..."; }
      clearInterval(quizState.timer);

      const { testType, questions: qsList, answers, startedAt } = quizState;
      const durationSeconds = Math.max(1, Math.min(86400, Math.round((Date.now() - startedAt) / 1000)));

      let correctCount = 0;
      const topicMap = new Map();
      qsList.forEach((q) => {
        const ok = answers[q.id] === q.correctIndex;
        if (ok) correctCount++;
        const cur = topicMap.get(q.topic) || { correct: 0, total: 0 };
        cur.total++;
        if (ok) cur.correct++;
        topicMap.set(q.topic, cur);
      });
      const totalQuestions = Math.max(1, qsList.length);
      const score = Math.round((correctCount / totalQuestions) * 100);
      const topicBreakdown = Array.from(topicMap.entries()).map(([topic, s]) => ({
        topic: topic.slice(0, 100), correct: s.correct, total: s.total, percentage: Math.round((s.correct / s.total) * 100)
      }));

      const safeKey = participant.participantKey;
      const subId = `${testType}_${safeKey.slice(0, 16)}_${Date.now()}`;
      const progressRef = doc(db, "progress_index", safeKey);
      const subRef = doc(db, "submissions", subId);

      try {
        const existingSnap = await getDoc(progressRef);
        const existingData = existingSnap.exists() ? existingSnap.data() : null;
        const batch = writeBatch(db);

        batch.set(subRef, {
          testType, participantKey: safeKey,
          fullName: participant.fullName.slice(0, 120),
          contact: participant.contact.slice(0, 120),
          region: participant.region.slice(0, 120),
          score, correctCount, totalQuestions, durationSeconds,
          answers, topicBreakdown, submittedAt: serverTimestamp(), syncedToSheet: false
        });

        const progPayload = testType === "pretest"
          ? { displayName: participant.fullName.slice(0, 120), region: participant.region.slice(0, 120), updatedAt: serverTimestamp(), pretestScore: score, pretestCorrect: correctCount, pretestTotal: totalQuestions, pretestDuration: durationSeconds, pretestTopicScores: topicBreakdown, pretestUpdatedAt: serverTimestamp() }
          : { displayName: participant.fullName.slice(0, 120), region: participant.region.slice(0, 120), updatedAt: serverTimestamp(), posttestScore: score, posttestCorrect: correctCount, posttestTotal: totalQuestions, posttestDuration: durationSeconds, posttestTopicScores: topicBreakdown, posttestUpdatedAt: serverTimestamp() };

        if (existingData) batch.update(progressRef, progPayload);
        else batch.set(progressRef, { participantKey: safeKey, ...progPayload });

        await batch.commit();

        currentProgress = {
          ...(existingData || {}),
          participantKey: safeKey,
          displayName: participant.fullName,
          region: participant.region,
          ...(testType === "pretest"
            ? { pretestScore: score, pretestCorrect: correctCount, pretestTotal: totalQuestions, pretestTopicScores: topicBreakdown }
            : { posttestScore: score, posttestCorrect: correctCount, posttestTotal: totalQuestions, posttestTopicScores: topicBreakdown })
        };
        lastAttempt = { testType, score, correctCount, totalQuestions, durationSeconds, questions: qsList, answers };
        quizState = null;
        closeModal();
        activeView = "progress";
        render();
      } catch (err) {
        quizState.submitting = false;
        if ($("#confirmSub")) { $("#confirmSub").disabled = false; $("#confirmSub").textContent = "Ya, Kumpulkan Sekarang"; }
        if ($("#submitModalErr")) $("#submitModalErr").innerHTML = `<div class="alert alert-err">Gagal menyimpan: ${esc(err.message)}</div>`;
      }
    }

    // ===== 4. PROGRES BELAJAR & GRAFIK =====

          </div>

          <div class="grid-2" style="margin-top:20px;">

              <div style="height:260px;margin-top:16px;"><canvas id="chartTopics"></canvas></div>
            </div>
          </div>

          ${pre !== null && post !== null ? `
            <div class="card" style="margin-top:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;">
              <div>
                <div class="meta-line" style="color:var(--ok);font-weight:700;">Evaluasi Lengkap · Pemilih Cerdas</div>
                <h3 style="margin-top:4px;">Terima kasih, ${esc(currentProgress.displayName)}!</h3>
                <p style="font-size:0.86rem;color:#475569;margin:4px 0 0;">Pretest ${pre} → Posttest ${post} (${delta >= 0 ? "+" + delta : delta} poin).</p>
              </div>

        ${lastAttempt ? `

            <h2>Pembahasan Soal ${lastAttempt.testType === "pretest" ? "Pretest" : "Posttest"}</h2>
            <div style="margin-top:14px;display:grid;gap:12px;">
              ${lastAttempt.questions.map((q, idx) => {
                const uAns = lastAttempt.answers[q.id];
                const ok = uAns === q.correctIndex;
                return `
                  <div class="card" style="padding:18px;">
                    <div style="display:flex;justify-content:space-between;font-size:0.78rem;">
                      <span class="meta-line">Soal ${idx + 1} · ${esc(q.topic)}</span>

                    </div>
                    <p style="font-weight:700;margin:8px 0;">${esc(q.prompt)}</p>
                    <div style="font-size:0.84rem;color:#334155;">
                      <div>Jawaban Anda: <strong>${typeof uAns === "number" ? LETTERS[uAns] + ". " + esc(q.options[uAns]) : "Tidak dijawab"}</strong></div>

                    </div>
                    ${q.explanation ? `<p style="font-size:0.82rem;color:#475569;margin:10px 0 0;padding-top:10px;border-top:1px solid var(--border);"><strong>Pembahasan:</strong> ${esc(q.explanation)}</p>` : ""}
                  </div>`;

            </div>
          </div>` : ""}`;

      if ($("#pGoPre")) $("#pGoPre").onclick = () => navigate("pretest");
      if ($("#pGoPost")) $("#pGoPost").onclick = () => navigate("posttest");
      if ($("#printBtn")) $("#printBtn").onclick = () => window.print();

      $("#lookupForm").onsubmit = async (e) => {
        e.preventDefault();

          $("#lookupMsg").innerHTML = `<div class="alert alert-warn">Masukkan minimal 5 karakter No. HP atau Email.</div>`;

        const key = await computeParticipantKey(val);
        const snap = await getDoc(doc(db, "progress_index", key));

          $("#lookupMsg").innerHTML = `<div class="alert alert-warn">Data progres tidak ditemukan untuk kontak tersebut.</div>`;

        }
      };

      if (currentProgress && window.Chart) {
        const c1 = new Chart($("#chartOverall"), {
          type: "bar",
          data: {
            labels: ["Pretest", "Posttest"],
            datasets: [{ label: "Skor", data: [pre ?? 0, post ?? 0], backgroundColor: ["#64748b", "#b91c1c"], borderRadius: 8, maxBarThickness: 64 }]
          },
          options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100 } }, plugins: { legend: { display: false } } }
        });
        chartInstances.push(c1);

        const tMap = new Map();
        (currentProgress.pretestTopicScores || []).forEach((t) => tMap.set(t.topic, { pre: t.percentage, post: 0 }));
        (currentProgress.posttestTopicScores || []).forEach((t) => {
          const cur = tMap.get(t.topic) || { pre: 0, post: 0 };
          cur.post = t.percentage;
          tMap.set(t.topic, cur);
        });
        const tLabels = Array.from(tMap.keys());

          type: "bar",
          data: {
            labels: tLabels,
            datasets: [
              { label: "Pretest (%)", data: tLabels.map((k) => tMap.get(k).pre), backgroundColor: "#64748b", borderRadius: 6 },
              { label: "Posttest (%)", data: tLabels.map((k) => tMap.get(k).post), backgroundColor: "#059669", borderRadius: 6 }
            ]
          },
          options: { responsive: true, maintainAspectRatio: false, scales: { y: { min: 0, max: 100 } } }
        });
        chartInstances.push(c2);
      }
    }

    async function loadAdminData() {
      try {
        const [subSnap, admSnap] = await Promise.all([
          getDocs(query(collection(db, "submissions"), orderBy("submittedAt", "desc"))),
          getDoc(doc(db, "settings", "adminConfig"))
        ]);
        submissions = subSnap.docs.map((d) => ({
          id: d.id,
          ...d.data(),
          submittedAtDate: d.data().submittedAt?.toDate ? d.data().submittedAt.toDate() : null
        }));
        if (admSnap.exists()) adminConfig = { ...adminConfig, ...admSnap.data() };
      } catch (err) {
        console.error(err);
      }
    }

    function buildEvaluationRows() {
      const map = new Map();
      submissions.forEach((s) => {
        const cur = map.get(s.participantKey) || { fullName: s.fullName, contact: s.contact, region: s.region, pre: null, post: null };
        if (s.testType === "pretest" && cur.pre === null) cur.pre = s;
        if (s.testType === "posttest" && cur.post === null) cur.post = s;
        map.set(s.participantKey, cur);
      });
      return Array.from(map.entries()).map(([key, item]) => {
        const preScore = item.pre ? item.pre.score : null;
        const postScore = item.post ? item.post.score : null;
        const delta = preScore !== null && postScore !== null ? postScore - preScore : null;
        const growth = preScore !== null && postScore !== null ? (preScore > 0 ? Math.round(((postScore - preScore) / preScore) * 100) : (postScore > 0 ? 100 : 0)) : null;
        let status = "Baru Pretest";
        if (preScore === null && postScore !== null) status = "Hanya Posttest";
        else if (delta !== null) status = delta >= 20 ? "Meningkat Signifikan" : delta > 0 ? "Meningkat" : delta === 0 ? "Stabil" : "Perlu Pendalaman";
        return { key, fullName: item.fullName, contact: item.contact, region: item.region, preScore, postScore, delta, growth, preAt: item.pre?.submittedAtDate || null, postAt: item.post?.submittedAtDate || null, status };
      });
    }

            r.readAsText(file);

          $("#saveJsonQ").onclick = async () => {
            try {
              const raw = $("#jsonQInput").value.trim();
              if (!raw) throw new Error("Isi soal masih kosong.");
              let items = [];
              if (raw.startsWith("[")) {
                items = JSON.parse(raw);
              } else {
                const lines = raw.split(/\r?\n/).filter((l) => l.trim());
                if (lines.length < 2) throw new Error("CSV minimal berisi 1 baris header dan 1 baris soal.");
                const splitCsv = (line) => {
                  const res = []; let cur = ""; let q = false;
                  for (let i = 0; i < line.length; i++) {
                    const ch = line[i];
                    if (ch === '"') { if (q && line[i + 1] === '"') { cur += '"'; i++; } else q = !q; }
                    else if ((ch === "," || ch === ";") && !q) { res.push(cur.trim()); cur = ""; }
                    else cur += ch;
                  }
                  res.push(cur.trim());
                  return res;
                };
                const headers = splitCsv(lines[0]).map((h) => h.toLowerCase());
                items = lines.slice(1).map((line) => {
                  const cols = splitCsv(line);
                  const row = {};
                  headers.forEach((h, i) => { row[h] = cols[i] || ""; });
                  const kunci = String(row.kunci || "A").trim().toUpperCase();
                  const keyIdx = { A: 0, B: 1, C: 2, D: 3 }[kunci] ?? (Number(kunci) || 0);
                  return {
                    prompt: row.pertanyaan || row.prompt,
                    topic: row.topik || row.topic || "Materi Pemilih",
                    options: [row.opsi_a, row.opsi_b, row.opsi_c, row.opsi_d],
                    correctIndex: Math.min(3, Math.max(0, keyIdx)),
                    explanation: row.pembahasan || row.explanation || "",
                    mode: ["both", "pretest", "posttest"].includes(row.mode) ? row.mode : "both"
                  };
                });
              }
              const batch = writeBatch(db);
              const next = items.map((item, idx) => {
                if (!item.prompt || !Array.isArray(item.options) || item.options.length !== 4 || item.options.some((o) => !String(o || "").trim())) {
                  throw new Error(`Baris soal ke-${idx + 1} belum lengkap (butuh pertanyaan & 4 opsi jawaban).`);

                const q = { id: `imp_${Date.now()}_${idx}`, mode: item.mode || "both", topic: String(item.topic || "Materi Pemilih").slice(0, 100), prompt: String(item.prompt).slice(0, 1000), options: item.options.map((o) => String(o).slice(0, 300)), correctIndex: Number(item.correctIndex) || 0, explanation: String(item.explanation || "").slice(0, 1500), order: questions.length + idx + 1, isActive: true };
                batch.set(doc(db, "questions", q.id), { ...q, updatedAt: serverTimestamp() });
                return q;
              });
              await batch.commit();
              questions = [...questions, ...next];
              isFromFirestore = true;

    }

    async function runSheetsSync(evalRows) {
      $("#doSync").disabled = true;
      $("#doSync").textContent = "Menyinkronkan...";
      const headers = { Authorization: `Bearer ${cachedAccessToken}`, "Content-Type": "application/json" };
      const sId = encodeURIComponent(adminConfig.spreadsheetId);
      const api = async (path, opt = {}) => {
        const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sId}${path}`, { ...opt, headers });
        const d = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(d?.error?.message || `Sheets error ${res.status}`);
        return d;
      };
      try {
        const meta = await api("?fields=properties.title,sheets.properties.title");
        const existingTabs = (meta.sheets || []).map((s) => s.properties.title);
        const need = [adminConfig.pretestSheetName, adminConfig.posttestSheetName, adminConfig.summarySheetName].filter((n) => !existingTabs.includes(n));
        if (need.length) {
          await api(":batchUpdate", { method: "POST", body: JSON.stringify({ requests: need.map((title) => ({ addSheet: { properties: { title } } })) }) });
        }
        const unsyncedPre = submissions.filter((s) => s.testType === "pretest" && !s.syncedToSheet);
        const unsyncedPost = submissions.filter((s) => s.testType === "posttest" && !s.syncedToSheet);
        const toRow = (s) => [s.submittedAtDate ? s.submittedAtDate.toLocaleString("id-ID") : "-", s.id, s.fullName, s.contact, s.region, s.testType, s.score, s.correctCount, s.totalQuestions, s.durationSeconds];

        for (const [tabName, rows] of [[adminConfig.pretestSheetName, unsyncedPre], [adminConfig.posttestSheetName, unsyncedPost]]) {
          const check = await api(`/values/${encodeURIComponent(tabName + "!A1:J1")}`);
          if (!check.values || !check.values.length) {
            await api(`/values/${encodeURIComponent(tabName + "!A1:J1")}?valueInputOption=USER_ENTERED`, {
              method: "PUT", body: JSON.stringify({ values: [["Waktu", "ID", "Nama Lengkap", "No. HP / Email", "Asal Daerah", "Jenis Tes", "Skor", "Benar", "Total Soal", "Durasi (dtk)"]] })
            });
          }
          if (rows.length) {
            await api(`/values/${encodeURIComponent(tabName + "!A:J")}:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`, {
              method: "POST", body: JSON.stringify({ values: rows.map(toRow) })
            });
          }
        }
        const sumValues = [
          ["No", "Nama Lengkap", "No. HP / Email", "Asal Daerah", "Skor Pretest", "Skor Posttest", "Selisih", "Kenaikan (%)", "Status"],
          ...evalRows.map((r, i) => [i + 1, r.fullName, r.contact, r.region, r.preScore ?? "-", r.postScore ?? "-", r.delta ?? "-", r.growth !== null ? r.growth + "%" : "-", r.status])
        ];
        await api(`/values/${encodeURIComponent(adminConfig.summarySheetName + "!A1:I2000")}:clear`, { method: "POST" });
        await api(`/values/${encodeURIComponent(adminConfig.summarySheetName + "!A1:I" + sumValues.length)}?valueInputOption=USER_ENTERED`, {
          method: "PUT", body: JSON.stringify({ values: sumValues })
        });
        const syncedIds = [...unsyncedPre, ...unsyncedPost].map((s) => s.id);
        if (syncedIds.length) {
          const batch = writeBatch(db);
          syncedIds.forEach((id) => batch.update(doc(db, "submissions", id), { syncedToSheet: true }));
          await batch.commit();
        }
        closeModal();
        await loadAdminData();
        renderAdmin();
        $("#sheetFeedback").innerHTML = `<div class="alert alert-ok">Sinkronisasi berhasil ke "${esc(meta.properties?.title || "Spreadsheet")}".</div>`;
      } catch (err) {
        $("#doSync").disabled = false;
        $("#doSync").textContent = "Ya, Sinkronkan Sekarang";
        $("#syncModalErr").innerHTML = `<div class="alert alert-err">${esc(err.message)}</div>`;
      }
    }

    function showModal(html) {
      $("#modalRoot").innerHTML = `<div class="modal-backdrop"><div class="modal-box">${html}</div></div>`;
    }
    function closeModal() { $("#modalRoot").innerHTML = ""; }

    loadInitialData();
  </script>
</body>
</html>
